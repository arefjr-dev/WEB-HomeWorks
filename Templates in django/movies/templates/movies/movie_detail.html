<!DOCTYPE html>
<html lang="fa" dir="rtl" class="mdui-theme-auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ movie.title }}</title>

  <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
  <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>

  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    body { font-family: Vazirmatn, sans-serif; }
    .container { max-width: 720px; margin: 24px auto; padding: 0 16px; }

    /* منوی بالا: دکمه‌ها در کامپیوتر، منوی کشویی در موبایل */
    .nav-desktop { display: flex; gap: 4px; }
    .nav-mobile { display: none; }

    /* عنوان فیلم */
    .movie-header { text-align: center; margin: 16px 0 24px; }
    .movie-header h1 { margin: 0 0 12px; }
    .movie-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .badge {
      padding: 2px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      background-color: rgb(var(--mdui-color-secondary-container));
      color: rgb(var(--mdui-color-on-secondary-container));
    }

    /* کارت‌های محتوا */
    .detail-card {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 24px;
      margin-bottom: 16px;
    }
    .detail-card h2 { margin-top: 0; }
    .detail-card p { margin: 0; line-height: 2; }

    .back-link { text-align: center; margin: 24px 0; }

    /* صفحه‌های باریک (موبایل) */
    @media (max-width: 640px) {
      .nav-desktop { display: none; }
      .nav-mobile { display: block; }
    }
    @media (max-width: 480px) {
      .container { padding: 0 12px; }
      .detail-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <mdui-top-app-bar>
    <mdui-top-app-bar-title>سکانس</mdui-top-app-bar-title>
    <div style="flex-grow: 1"></div>

    <div class="nav-desktop">
      <mdui-button variant="text" href="/about/">درباره ما</mdui-button>
      <mdui-button variant="text" href="/contact/">تماس با ما</mdui-button>
      <mdui-button variant="tonal" href="/movies/">فیلم‌ها</mdui-button>
      <mdui-button variant="text" href="/login/">ورود</mdui-button>
      <mdui-button variant="text" href="/register/">ثبت‌نام</mdui-button>
    </div>

    <mdui-dropdown class="nav-mobile">
      <mdui-button slot="trigger" variant="tonal">منو</mdui-button>
      <mdui-menu>
        <mdui-menu-item href="/about/">درباره ما</mdui-menu-item>
        <mdui-menu-item href="/contact/">تماس با ما</mdui-menu-item>
        <mdui-menu-item href="/movies/">فیلم‌ها</mdui-menu-item>
        <mdui-menu-item href="/login/">ورود</mdui-menu-item>
        <mdui-menu-item href="/register/">ثبت‌نام</mdui-menu-item>
      </mdui-menu>
    </mdui-dropdown>
  </mdui-top-app-bar>

  <main class="container">

    <div class="movie-header">
      <h1>{{ movie.title }}</h1>
      <div class="movie-meta">
        <span class="badge">{{ movie.get_genre_display }}</span>
        <span class="badge">{% if movie.is_series %}سریال{% else %}فیلم{% endif %}</span>
        <span class="badge">{{ movie.release_year }}</span>
      </div>
    </div>

    <mdui-card class="detail-card" variant="outlined">
      <h2>خلاصه داستان</h2>
      <p>{{ movie.description }}</p>
    </mdui-card>

    <mdui-card class="detail-card" variant="elevated">
      <h2>مشخصات</h2>
      <mdui-list>
        <mdui-list-item nonclickable headline="کارگردان" description="{{ movie.director }}"></mdui-list-item>
        <mdui-list-item nonclickable headline="سال ساخت" description="{{ movie.release_year }}"></mdui-list-item>
        <mdui-list-item nonclickable
          headline="{% if movie.is_series %}مدت هر قسمت{% else %}مدت فیلم{% endif %}"
          description="{{ movie.duration_minutes }} دقیقه">
        </mdui-list-item>
        <mdui-list-item nonclickable headline="امتیاز" description="{{ movie.rating|default:'—' }} از ۱۰"></mdui-list-item>
        <mdui-list-item nonclickable headline="تاریخ ثبت در سکانس" description="{{ movie.created_at|date:'Y/m/d' }}"></mdui-list-item>
      </mdui-list>
    </mdui-card>

    <div class="back-link">
      <mdui-button variant="outlined" href="/movies/">بازگشت به فهرست فیلم‌ها</mdui-button>
    </div>

  </main>
</body>
</html>
