<!DOCTYPE html>
<html lang="fa" dir="rtl" class="mdui-theme-auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود</title>

  <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
  <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>

  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    body { font-family: Vazirmatn, sans-serif; }
    .container { max-width: 960px; margin: 24px auto; padding: 0 16px; }

    /* منوی بالا: دکمه‌ها در کامپیوتر، منوی کشویی در موبایل */
    .nav-desktop { display: flex; gap: 4px; }
    .nav-mobile { display: none; }

    /* فرم ورود */
    .form-wrapper { display: flex; justify-content: center; }
    .form-card {
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      padding: 24px;
    }
    .form-card h1 { margin-top: 0; }
    .form-card mdui-text-field { width: 100%; margin-bottom: 16px; }
    .form-card mdui-button[type="submit"] { width: 100%; }
    .form-footer { margin-top: 16px; text-align: center; }

    /* صفحه‌های باریک (موبایل) */
    @media (max-width: 640px) {
      .nav-desktop { display: none; }
      .nav-mobile { display: block; }
    }
    @media (max-width: 480px) {
      .container { padding: 0 12px; }
      .form-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <mdui-top-app-bar>
    <mdui-top-app-bar-title>سکانس</mdui-top-app-bar-title>
    <div style="flex-grow: 1"></div>

    <div class="nav-desktop">
      <mdui-button variant="text" href="/about/">درباره ما</mdui-button>
      <mdui-button variant="text" href="/contact/">تماس با ما</mdui-button>
      <mdui-button variant="tonal" href="/login/">ورود</mdui-button>
      <mdui-button variant="text" href="/register/">ثبت‌نام</mdui-button>
    </div>

    <mdui-dropdown class="nav-mobile">
      <mdui-button slot="trigger" variant="tonal">منو</mdui-button>
      <mdui-menu>
        <mdui-menu-item href="/about/">درباره ما</mdui-menu-item>
        <mdui-menu-item href="/contact/">تماس با ما</mdui-menu-item>
        <mdui-menu-item href="/login/">ورود</mdui-menu-item>
        <mdui-menu-item href="/register/">ثبت‌نام</mdui-menu-item>
      </mdui-menu>
    </mdui-dropdown>
  </mdui-top-app-bar>

  <main class="container">
    <div class="form-wrapper">
      <mdui-card class="form-card" variant="elevated">
        <h1>ورود به سکانس</h1>

        <form method="post" action="/login/">
          {% csrf_token %}

          <mdui-text-field
            variant="outlined"
            label="نام کاربری یا ایمیل"
            name="username"
            required>
          </mdui-text-field>

          <mdui-text-field
            variant="outlined"
            type="password"
            label="رمز عبور"
            name="password"
            toggle-password
            required>
          </mdui-text-field>

          <mdui-button type="submit" variant="filled">ورود</mdui-button>
        </form>

        <p class="form-footer">
          حساب کاربری ندارید؟
          <a href="/register/">ثبت‌نام کنید</a>
        </p>
      </mdui-card>
    </div>
  </main>
</body>
</html>
